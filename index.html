 conic-gradient(from -8deg,rgba(244,231,200,.5) 0 16deg,transparent 0 90deg,rgba(244,231,200,.5) 0 106deg,transparent 0 180deg,rgba(244,231,200,.5) 0 196deg,transparent 0 270deg,rgba(244,231,200,.5) 0 286deg,transparent 0);

<body>
<canvas id="c"></canvas>
<div id="probe"></div>
<div id="ctl">
  <div id="stickZone"><div id="stickBase"><div id="stickKnob"></div></div></div>
  <button id="btnA" class="pad" aria-label="決定"><b>A</b><span id="lblA">調べる</span></button>
  <button id="btnB" class="pad" aria-label="キャンセル"><b>B</b><span id="lblB">ダッシュ</span></button>
  <div id="top">
    <button id="btnMenu" class="tb" aria-label="メニュー"><svg viewBox="0 0 28 28"><path d="M6 8h16M6 14h16M6 20h16"/></svg></button>
    <button id="btnSound" class="tb" aria-label="サウンド切替"><svg viewBox="0 0 28 28"><path d="M5 11v6h4l6 5V6l-6 5z" fill="#f4e7c8"/><path id="sndOn" d="M19 10a6 6 0 0 1 0 8M22 7a10 10 0 0 1 0 14"/><path id="sndOff" d="M19 11l6 6M25 11l-6 6" style="display:none"/></svg></button>

  <p>スマホを横にしてください<small>このゲームは横画面専用です</small></p>

<script>
(() => {
'use strict';
/* ============ 基本 ============ */
const W = 960, H = 540, TS = 48;
const PAL = { navy:'#1c2340', night:'#141a30', cream:'#f4e7c8', green:'#3f5b3c', terra:'#b8593a', gold:'#e5b95c', ink:'#2a2233', leaf:'#7fa653', sky:'#2b3560', dim:'#a89e8c' };
const FONT = '"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo","Noto Sans CJK JP","Noto Sans JP",sans-serif';
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const irnd = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const cv = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const canvas = $('c'), g = canvas.getContext('2d');
const DEBUG = /[?&]debug/.test(location.search);
function seeded(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = (x, y) => { let h = Math.imul(x * 374761393 + y * 668265263, 1274126177); h ^= h >>> 13; h = Math.imul(h, 1103515245); return ((h ^ h >>> 16) >>> 0) / 4294967296; };

/* ============ サウンド（WebAudio 合成） ============ */
const Snd = (() => {
  let ctx = null, master = null, bgmGain = null, seGain = null, muted = false, cur = null, nextT = 0, step = 0, timer = 0;
  const NOTE = { C:0, 'C#':1, D:2, 'D#':3, E:4, F:5, 'F#':6, G:7, 'G#':8, A:9, 'A#':10, B:11 };
  const freq = n => { const m = n.match(/^([A-G]#?)(\d)$/); return 440 * Math.pow(2, (NOTE[m[1]] + (+m[2] + 1) * 12 - 69) / 12); };
  const rep = (s, n) => Array(n).fill(s).join(' ');
  const T = {
    title: { bpm: 92, lead: 'E5 - G5 - A5 - G5 E5 D5 - E5 - C5 - - - E5 - G5 - C6 - B5 A5 G5 - - - - - - - A5 - C6 - D6 - C6 A5 G5 - A5 - E5 - - - D5 - E5 - G5 - A5 G5 E5 - D5 - C5 - - -',
      bass: 'C3 G3 C4 G3 A2 E3 A3 E3 F2 C3 F3 C3 G2 D3 G3 D3 C3 G3 C4 G3 E3 B3 E4 B3 F2 C3 F3 C3 G2 D3 G3 D3', wave: 'triangle' },
    village: { bpm: 112, lead: 'G4 A4 C5 - A4 C5 D5 - E5 - D5 C5 A4 - G4 - A4 C5 D5 - C5 D5 E5 - G5 - E5 D5 C5 - - - E5 - E5 G5 A5 - G5 E5 D5 - C5 D5 E5 - D5 C5 A4 - C5 A4 G4 - A4 C5 D5 - C5 - - -',
      bass: 'C3 - G3 - A2 - E3 - F2 - C3 - G2 - D3 - C3 - G3 - E3 - B3 - F2 - C3 - G2 - G3 -', wave: 'square' },
    forest: { bpm: 104, lead: 'A4 - C5 E5 - D5 C5 - B4 - G4 - E4 - - - A4 - C5 E5 - G5 F5 - E5 - D5 - C5 - - - F5 - E5 D5 - C5 D5 - E5 - C5 - A4 - - - B4 - C5 D5 - E5 D5 - A4 - - - - - - -',
      bass: 'A2 E3 A3 E3 G2 D3 G3 D3 F2 C3 F3 C3 E2 B2 E3 B2 A2 E3 A3 E3 G2 D3 G3 D3 F2 C3 F3 C3 E2 B2 E3 G3', wave: 'triangle' },
    cave: { bpm: 84, lead: 'D4 - - F4 - - A4 - G#4 - - - - - F4 - D4 - - F4 - - C5 - A#4 - - - A4 - - - G4 - - A#4 - - D5 - C5 - - - A4 - F4 - E4 - - G4 - - A#4 - A4 - - - - - - -',
      bass: 'D2 - D3 - D2 - D3 - C#2 - C#3 - C#2 - C#3 - A#1 - A#2 - A#1 - A#2 - A1 - A2 - A1 - A2 -', wave: 'triangle' },
    battle: { bpm: 168, lead: 'E5 E5 - E5 D5 E5 G5 - E5 - D5 C5 - D5 E5 - A4 C5 E5 - A5 G5 E5 D5 C5 - D5 - E5 - - - F5 F5 - F5 E5 F5 A5 - F5 - E5 D5 - E5 F5 - G5 F5 E5 D5 C5 D5 E5 G5 A5 - B5 - C6 - - -',
      bass: 'A2 A3 A2 A3 A2 A3 A2 A3 F2 F3 F2 F3 G2 G3 G2 G3 A2 A3 A2 A3 A2 A3 A2 A3 F2 F3 G2 G3 A2 E3 A3 E3 D3 D4 D3 D4 D3 D4 D3 D4 C3 C4 C3 C4 E3 E4 E3 E4 F2 F3 F2 F3 G2 G3 G2 G3 A2 A3 E3 E4 A2 E3 A3 A2', wave: 'square' },
    boss: { bpm: 176, lead: 'D5 - D5 F5 - D5 A5 - G#5 - A5 - F5 - D5 - D5 - D5 F5 - D5 C6 - A#5 - A5 - G5 - F5 - G5 - G5 A#5 - G5 D6 - C6 - A#5 - A5 - G5 - F5 E5 F5 G5 A5 A#5 A5 G5 F5 E5 D5 - - - - -',
      bass: 'D2 D3 D2 D3 D2 D3 D2 D3 D2 D3 D2 D3 C#2 C#3 C#2 C#3 A#1 A#2 A#1 A#2 A#1 A#2 A#1 A#2 A1 A2 A1 A2 A1 A2 C#3 E3', wave: 'sawtooth' },
    ending: { bpm: 96, lead: 'C5 - E5 G5 - E5 G5 C6 - B5 A5 G5 - - - - A5 - C6 A5 - G5 E5 G5 - F5 E5 D5 - - - - C5 - E5 G5 - E5 G5 C6 - D6 E6 D6 - C6 A5 - F5 - A5 C6 - B5 A5 G5 - E5 D5 C5 - - - -',
      bass: 'C3 G3 E4 G3 G2 D3 B3 D3 A2 E3 C4 E3 F2 C3 A3 C3 C3 G3 E4 G3 G2 D3 B3 D3 F2 C3 A3 C3 G2 D3 G3 B3', wave: 'triangle' },
  };
  for (const k in T) { T[k].L = T[k].lead.split(' '); T[k].B = T[k].bass.split(' '); }
  function tone(f, t, dur, type, vol, dest, slide) {
    const o = ctx.createOscillator(), a = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + dur);
    a.gain.setValueAtTime(0.0001, t);
    a.gain.linearRampToValueAtTime(vol, t + 0.008);
    a.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(a); a.connect(dest); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(t, dur, vol, cutoff, dest) {
    const n = Math.floor(ctx.sampleRate * dur), buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const s = ctx.createBufferSource(), a = ctx.createGain(), f = ctx.createBiquadFilter();
    s.buffer = buf; f.type = 'lowpass'; f.frequency.value = cutoff;
    a.gain.setValueAtTime(vol, t); a.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(a); a.connect(dest); s.start(t);
  }
  function pump() {
    if (!ctx || !cur || ctx.state !== 'running') return;
    const tr = T[cur], sp = 60 / tr.bpm / 2;
    if (nextT < ctx.currentTime) nextT = ctx.currentTime + 0.05;
    while (nextT < ctx.currentTime + 0.2) {
      const l = tr.L[step % tr.L.length], b = tr.B[step % tr.B.length];
      if (l !== '-') { tone(freq(l), nextT, sp * 1.7, 'square', 0.048, bgmGain); tone(freq(l) * 1.004, nextT, sp * 1.4, 'triangle', 0.03, bgmGain); }
      if (b !== '-') tone(freq(b), nextT, sp * 1.3, tr.wave === 'sawtooth' ? 'sawtooth' : 'triangle', tr.wave === 'sawtooth' ? 0.055 : 0.11, bgmGain);
      if ((cur === 'battle' || cur === 'boss') && step % 2 === 0) noise(nextT, 0.05, step % 4 === 2 ? 0.07 : 0.03, 5000, bgmGain);
      step++; nextT += sp;
    }
  }
  const api = {
    unlock() {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ctx = new AC();
        master = ctx.createGain(); master.gain.value = muted ? 0 : 0.8; master.connect(ctx.destination);
        bgmGain = ctx.createGain(); bgmGain.gain.value = 0.7; bgmGain.connect(master);
        seGain = ctx.createGain(); seGain.gain.value = 1; seGain.connect(master);
        timer = setInterval(pump, 40);
      }
      if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    },
    bgm(name) { if (cur === name) return; cur = name; step = 0; nextT = 0; },
    stop() { cur = null; },
    setMuted(m) { muted = m; if (master) master.gain.value = m ? 0 : 0.8; },
    get muted() { return muted; },
    suspend() { if (ctx && ctx.state === 'running') ctx.suspend().catch(() => {}); },
    resume() { if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {}); },
    se(name) {
      if (!ctx || ctx.state !== 'running') return;
      const t = ctx.currentTime + 0.005, d = seGain, seq = (ns, gap, dur, ty, v) => ns.forEach((n, i) => tone(freq(n), t + i * gap, dur, ty, v, d));
      switch (name) {
        case 'cursor': tone(880, t, 0.04, 'square', 0.05, d); break;
        case 'ok': seq(['E6', 'A6'], 0.05, 0.07, 'square', 0.07); break;
        case 'cancel': seq(['A5', 'E5'], 0.05, 0.07, 'square', 0.06); break;
        case 'bad': tone(160, t, 0.16, 'square', 0.08, d, 110); break;
        case 'hit': noise(t, 0.09, 0.32, 2400, d); tone(220, t, 0.08, 'square', 0.1, d, 90); break;
        case 'crit': noise(t, 0.16, 0.42, 4200, d); tone(520, t, 0.14, 'square', 0.12, d, 120); seq(['C7'], 0, 0.1, 'square', 0.05); break;
        case 'hurt': noise(t, 0.14, 0.34, 900, d); tone(140, t, 0.14, 'sawtooth', 0.12, d, 60); break;
        case 'fire': noise(t, 0.34, 0.3, 1400, d); tone(180, t, 0.3, 'sawtooth', 0.09, d, 720); break;
        case 'leaf': seq(['A5', 'C6', 'E6', 'A6'], 0.035, 0.06, 'triangle', 0.13); noise(t, 0.16, 0.12, 6000, d); break;
        case 'heal': seq(['C6', 'E6', 'G6', 'C7'], 0.07, 0.15, 'triangle', 0.13); break;
        case 'buy': seq(['B5', 'E6'], 0.06, 0.1, 'square', 0.07); break;
        case 'chest': seq(['G5', 'C6', 'E6', 'G6'], 0.07, 0.11, 'square', 0.07); break;
        case 'item': seq(['E6', 'G6', 'B6', 'E7'], 0.08, 0.2, 'triangle', 0.13); break;
        case 'door': noise(t, 0.3, 0.2, 500, d); tone(90, t, 0.3, 'square', 0.07, d, 50); break;
        case 'encounter': seq(['A5', 'E5', 'A5', 'E6'], 0.05, 0.08, 'square', 0.08); break;
        case 'flee': seq(['E6', 'C6', 'A5', 'F5'], 0.05, 0.07, 'triangle', 0.13); break;
        case 'win': seq(['C5', 'C5', 'C5', 'C5', 'G#4', 'A#4', 'C5', 'A#4', 'C5'], 0.085, 0.13, 'square', 0.07); break;
        case 'level': seq(['C5', 'E5', 'G5', 'C6', 'E6', 'G6'], 0.065, 0.2, 'square', 0.075); break;
        case 'lose': seq(['A4', 'F4', 'D4', 'A3'], 0.2, 0.34, 'triangle', 0.17); break;
        case 'roar': noise(t, 0.7, 0.4, 700, d); tone(80, t, 0.7, 'sawtooth', 0.16, d, 240); break;
        case 'dark': noise(t, 0.5, 0.3, 1100, d); tone(420, t, 0.5, 'sawtooth', 0.1, d, 50); break;
        case 'charge': tone(160, t, 0.4, 'sawtooth', 0.08, d, 640); break;
      }
    },
  };
  return api;
})();

/* ============ 入力 ============ */
const Inp = {
  dx: 0, dy: 0, dash: false, held: {}, stick: { x: 0, y: 0 },
  e: { a: 0, b: 0, menu: 0, up: 0, down: 0, left: 0, right: 0 }, tap: null, touch: false,
  clear() { for (const k in this.e) this.e[k] = 0; this.tap = null; },
  axis() {
    const h = this.held; let x = (h.right ? 1 : 0) - (h.left ? 1 : 0), y = (h.down ? 1 : 0) - (h.up ? 1 : 0);
    if (this.stick.x || this.stick.y) { x = this.stick.x; y = this.stick.y; }
    this.dx = x; this.dy = y; this.dash = !!(h.dash || h.b);
  },
};
const KEYMAP = { ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down', ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right', KeyZ:'a', Enter:'a', Space:'a', KeyX:'cancel', Escape:'cancel', ShiftLeft:'dash', ShiftRight:'dash', KeyM:'menu', Tab:'menu' };
addEventListener('keydown', ev => {
  const k = KEYMAP[ev.code]; Snd.unlock();
  if (!k) return;
  ev.preventDefault();
  if (ev.repeat) { if (['up', 'down', 'left', 'right'].includes(k)) Inp.e[k] = 1; return; }
  if (k === 'cancel') { Inp.e.b = 1; Inp.e.menu = 1; return; }
  if (k === 'menu') { Inp.e.menu = 1; return; }
  Inp.held[k] = true; if (k in Inp.e) Inp.e[k] = 1;
});
addEventListener('keyup', ev => { const k = KEYMAP[ev.code]; if (k) Inp.held[k] = false; });
addEventListener('blur', () => { Inp.held = {}; Inp.stick.x = Inp.stick.y = 0; });
['contextmenu', 'gesturestart', 'gesturechange', 'selectstart', 'dragstart'].forEach(t => document.addEventListener(t, e => e.preventDefault()));
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('dblclick', e => e.preventDefault());

/* 画面フィット（レターボックス＋DPR＋セーフエリア） */
const View = { s: 1, ox: 0, oy: 0, dpr: 1, cw: 0, ch: 0 };
function resize() {
  const ww = window.innerWidth, wh = window.innerHeight, cs = getComputedStyle($('probe'));
  const st = parseFloat(cs.paddingTop) || 0, sr = parseFloat(cs.paddingRight) || 0, sb = parseFloat(cs.paddingBottom) || 0, sl = parseFloat(cs.paddingLeft) || 0;
  const aw = ww - sl - sr, ah = wh - st - sb, dpr = Math.min(window.devicePixelRatio || 1, 3);
  const s = Math.min(aw / W, ah / H);
  View.s = s; View.dpr = dpr; View.cw = ww; View.ch = wh;
  View.ox = sl + (aw - W * s) / 2; View.oy = st + (ah - H * s) / 2;
  canvas.width = Math.round(ww * dpr); canvas.height = Math.round(wh * dpr);
  placeStick();
}
const toLogical = (cx, cy) => ({ x: (cx - View.ox) / View.s, y: (cy - View.oy) / View.s });
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 120));
if (window.visualViewport) visualViewport.addEventListener('resize', resize);

canvas.addEventListener('pointerdown', ev => {
  ev.preventDefault(); Snd.unlock();
  if (ev.pointerType === 'touch') Inp.touch = true;
  Inp.tap = toLogical(ev.clientX, ev.clientY);
});

/* 仮想スティック */
const zone = $('stickZone'), base = $('stickBase'), knob = $('stickKnob');
const stickState = { id: null, bx: 0, by: 0 };
const STICK_R = 54;
function placeStick(x, y) {
  const r = zone.getBoundingClientRect();
  if (x === undefined) { x = 92 + (parseFloat(getComputedStyle($('probe')).paddingLeft) || 0); y = (r.height || window.innerHeight * .74) - 84; }
  stickState.bx = x; stickState.by = y;
  base.style.left = x + 'px'; base.style.top = y + 'px';
}
function stickMove(ev) {
  const r = zone.getBoundingClientRect(), px = ev.clientX - r.left, py = ev.clientY - r.top;
  let dx = px - stickState.bx, dy = py - stickState.by, d = Math.hypot(dx, dy);
  if (d > STICK_R) { // 指に追従してベースも動く
    const over = d - STICK_R;
    placeStick(stickState.bx + dx / d * over, stickState.by + dy / d * over);
    dx = px - stickState.bx; dy = py - stickState.by; d = STICK_R;
  }
  knob.style.transform = `translate(${dx}px,${dy}px)`;
  if (d < 12) { Inp.stick.x = Inp.stick.y = 0; return; }
  const oct = Math.round(Math.atan2(dy, dx) / (Math.PI / 4)), a = oct * Math.PI / 4; // 8方向
  const c = Math.cos(a), s = Math.sin(a);
  Inp.stick.x = Math.abs(c) < .01 ? 0 : Math.round(c * 1000) / 1000;
  Inp.stick.y = Math.abs(s) < .01 ? 0 : Math.round(s * 1000) / 1000;
}
zone.addEventListener('pointerdown', ev => {
  ev.preventDefault(); Snd.unlock(); Inp.touch = true;
  if (stickState.id !== null) return;
  stickState.id = ev.pointerId;
  try { zone.setPointerCapture(ev.pointerId); } catch (e) {}
  const r = zone.getBoundingClientRect();
  placeStick(ev.clientX - r.left, ev.clientY - r.top); stickMove(ev);
});
zone.addEventListener('pointermove', ev => { if (ev.pointerId === stickState.id) { ev.preventDefault(); stickMove(ev); } });
const stickEnd = ev => {
  if (ev.pointerId !== stickState.id) return;
  stickState.id = null; Inp.stick.x = Inp.stick.y = 0; knob.style.transform = ''; placeStick();
};
zone.addEventListener('pointerup', stickEnd); zone.addEventListener('pointercancel', stickEnd);

function holdBtn(el, onDown, onUp) {
  const ids = new Set();
  el.addEventListener('pointerdown', ev => {
    ev.preventDefault(); ev.stopPropagation(); Snd.unlock(); if (ev.pointerType === 'touch') Inp.touch = true;
    ids.add(ev.pointerId); try { el.setPointerCapture(ev.pointerId); } catch (e) {}
    el.classList.add('down'); onDown();

const Intro = {

/* ============ メインループ ============ */
let ctlClass = '';
function syncCtl() {
  const cur = Scene.cur, top = Scene.top(); let stick = false, ab = false, menu = false, la = '決定', lb = 'もどる';
  if (cur === Field) {
    if (!top) { stick = ab = menu = true; lb = 'ダッシュ'; la = Field.near ? (Field.near.kind === 'npc' ? '話す' : '調べる') : '調べる'; }

    else ab = true;
  } else if (cur === Battle) {

  }
  const show = Inp.touch || (window.matchMedia && matchMedia('(pointer:coarse)').matches);
  const cls = [show && stick ? 's-stick' : '', show && ab ? 's-ab' : '', menu ? 's-menu' : ''].filter(Boolean).join(' ');
  if (cls !== ctlClass) {
    const wasStick = ctlClass.includes('s-stick'); ctlClass = cls; document.body.className = cls;

  if ($('lblB').textContent !== lb) $('lblB').textContent = lb;
}
function step(dt) {

    if (F.t >= F.dur) { if (F.out) { F.out = false; F.t = 0; const cb = F.cb; F.cb = null; cb && cb(); } else Scene.fade = null; }
  } else { const top = Scene.top(); if (top) top.update(dt); else Scene.cur.update(dt); }
  // プレイ時間: 会話・ショップ込み、ポーズ中は止める
  if (s && (Scene.cur === Field || Scene.cur === Battle) && !(Scene.top() && Scene.top().kind === 'pause')) s.time += dt;
  if (toastMsg && (toastMsg.t -= dt) <= 0) toastMsg = null;
  Inp.clear();
}

  g.restore();
}
let last = 0;
function frame(now) {
  requestAnimationFrame(frame);

  step(dt); syncCtl(); render();
}

});
